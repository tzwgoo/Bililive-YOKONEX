<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蓝牙实时叠加窗</title>
    <style>
      :root {
        color-scheme: dark;
        --overlay-white: #fff5ff;
        --overlay-soft: #d8b7c4;
        --overlay-line: rgba(217, 138, 168, 0.2);
        --overlay-line-strong: rgba(217, 138, 168, 0.34);
        --overlay-accent: #d98aa8;
        --overlay-accent-soft: #ebb2c7;
        --channel-a: #ff8a4c;
        --channel-b: #51a8ff;
        --channel-c: #a78bfa;
        --surface-bg: rgba(18, 11, 22, 0.72);
        --surface-strong: rgba(27, 16, 33, 0.84);
        --surface-soft: rgba(37, 17, 44, 0.76);
        --overlay-shadow: 0 18px 36px rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Bahnschrift", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        display: flex;
        align-items: stretch;
        justify-content: stretch;
      }

      .overlay-root {
        width: 100%;
        height: 100%;
        padding: 12px;
        color: var(--overlay-white);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.34);
      }

      .overlay-shell {
        width: 100%;
        height: 100%;
        display: grid;
        gap: 12px;
        grid-template-rows: auto minmax(0, 1fr);
        padding: 14px;
        border: 1px solid var(--overlay-line);
        border-radius: 24px;
        background:
          radial-gradient(circle at top left, rgba(217, 138, 168, 0.24), transparent 34%),
          radial-gradient(circle at top right, rgba(235, 178, 199, 0.12), transparent 30%),
          linear-gradient(180deg, rgba(21, 10, 27, 0.9), rgba(8, 6, 10, 0.76));
        backdrop-filter: blur(14px);
        box-shadow: var(--overlay-shadow);
      }

      .overlay-root[data-connected="false"] .overlay-dot {
        background: rgba(255, 145, 145, 0.92);
        box-shadow: 0 0 0 8px rgba(255, 145, 145, 0.14);
      }

      .overlay-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .overlay-status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--overlay-soft);
      }

      .overlay-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: rgba(144, 255, 200, 0.96);
        box-shadow: 0 0 0 8px rgba(144, 255, 200, 0.14);
      }

      .overlay-summary {
        min-width: 0;
      }

      .overlay-summary-title {
        margin: 0;
        font-size: 34px;
        font-weight: 800;
        line-height: 1.02;
      }

      .overlay-summary-subtitle {
        margin: 8px 0 0;
        color: var(--overlay-soft);
        font-size: 14px;
      }

      .overlay-devices {
        min-height: 0;
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        align-content: start;
      }

      .overlay-empty {
        height: 100%;
        display: grid;
        place-items: center;
        border: 1px dashed var(--overlay-line);
        border-radius: 20px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01)),
          rgba(18, 11, 22, 0.52);
        color: var(--overlay-soft);
        font-size: 16px;
        font-weight: 700;
      }

      /* OBS 小窗卡片沿用主面板的深色玫瑰风格，保证设备信息和波形区在直播画面里也统一 */
      .overlay-device-card {
        min-width: 0;
        display: grid;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--overlay-line);
        border-radius: 20px;
        background:
          linear-gradient(180deg, rgba(217, 138, 168, 0.1), rgba(255, 255, 255, 0)),
          var(--surface-bg);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .overlay-device-card[data-device-type="toy"] {
        background:
          linear-gradient(180deg, rgba(167, 139, 250, 0.14), rgba(255, 255, 255, 0)),
          var(--surface-bg);
      }

      .overlay-device-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .overlay-device-name {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        line-height: 1.08;
      }

      .overlay-device-meta {
        margin-top: 6px;
        color: var(--overlay-soft);
        font-size: 12px;
      }

      .overlay-device-tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .overlay-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid var(--overlay-line);
        background: rgba(255, 255, 255, 0.04);
        font-size: 12px;
        font-weight: 700;
        color: var(--overlay-white);
      }

      .overlay-waveform {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        background:
          radial-gradient(circle at top left, rgba(217, 138, 168, 0.1), transparent 44%),
          var(--surface-strong);
      }

      .overlay-waveform-label {
        color: var(--overlay-soft);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .overlay-waveform-name {
        margin-top: 4px;
        font-size: 16px;
        font-weight: 800;
      }

      .overlay-strength-summary {
        color: var(--overlay-soft);
        font-size: 12px;
        text-align: right;
      }

      .overlay-strength-value {
        margin-top: 4px;
        font-size: 18px;
        font-weight: 800;
        color: var(--overlay-accent-soft);
      }

      .overlay-telemetry {
        display: grid;
        gap: 10px;
      }

      .overlay-channel {
        display: grid;
        gap: 6px;
      }

      .overlay-channel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: var(--overlay-soft);
        font-size: 13px;
      }

      .overlay-channel-head strong {
        color: var(--overlay-white);
        font-size: 18px;
      }

      .overlay-bar-track {
        width: 100%;
        height: 20px;
        overflow: hidden;
        border-radius: 999px;
        border: 1px solid var(--overlay-line);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0) 42%),
          rgba(10, 10, 14, 0.56);
      }

      .overlay-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        transition: width 120ms linear;
      }

      .overlay-bar-fill-a {
        background: linear-gradient(90deg, rgba(255, 138, 76, 0.24), var(--channel-a));
      }

      .overlay-bar-fill-b {
        background: linear-gradient(90deg, rgba(81, 168, 255, 0.24), var(--channel-b));
      }

      .overlay-bar-fill-c {
        background: linear-gradient(90deg, rgba(167, 139, 250, 0.24), var(--channel-c));
      }

      .overlay-canvas-wrap {
        height: 86px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.05);
        background:
          radial-gradient(circle at top left, rgba(217, 138, 168, 0.08), transparent 38%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0)),
          rgba(14, 8, 18, 0.38);
      }

      .overlay-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      @media (max-width: 900px) {
        .overlay-root {
          padding: 8px;
        }

        .overlay-shell {
          padding: 10px;
          gap: 10px;
        }

        .overlay-head {
          flex-direction: column;
          align-items: flex-start;
        }

        .overlay-summary-title {
          font-size: 26px;
        }

        .overlay-devices {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="overlay-root" id="overlay-root" data-connected="false" data-style="{{ overlay_style }}">
      <section class="overlay-shell">
        <header class="overlay-head">
          <div class="overlay-summary">
            <div class="overlay-status">
              <span class="overlay-dot"></span>
              <span id="overlay-connection-text">蓝牙未连接</span>
            </div>
            <h1 class="overlay-summary-title" id="overlay-summary-title">待机中</h1>
            <p class="overlay-summary-subtitle" id="overlay-summary-subtitle">当前没有已连接设备</p>
          </div>
        </header>

        <section class="overlay-devices" id="overlay-devices">
          <div class="overlay-empty">等待蓝牙设备连接</div>
        </section>
      </section>
    </main>

    <script src="/static/bluetooth_overlay.js"></script>
  </body>
</html>
