<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蓝牙实时叠加窗</title>
    <style>
      :root {
        color-scheme: dark;
        --overlay-white: rgba(255, 247, 240, 0.98);
        --overlay-soft: rgba(255, 247, 240, 0.76);
        --overlay-line: rgba(255, 255, 255, 0.18);
        --channel-a: #ff8a4c;
        --channel-b: #51a8ff;
        --panel-bg: rgba(18, 12, 10, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Bahnschrift", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        display: flex;
        align-items: stretch;
        justify-content: stretch;
        padding: 0;
      }

      .overlay-root {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: minmax(150px, 0.7fr) minmax(170px, 0.84fr) minmax(200px, 1fr) minmax(210px, 1fr);
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        color: var(--overlay-white);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
        background: linear-gradient(90deg, rgba(16, 10, 8, 0.12), rgba(16, 10, 8, 0));
      }

      .overlay-root[data-connected="false"] .overlay-dot {
        background: rgba(255, 145, 145, 0.92);
        box-shadow: 0 0 0 8px rgba(255, 145, 145, 0.16);
      }

      .overlay-meta {
        display: grid;
        gap: 8px;
      }

      .overlay-status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .overlay-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: rgba(144, 255, 200, 0.96);
        box-shadow: 0 0 0 8px rgba(144, 255, 200, 0.16);
      }

      .overlay-waveform-name {
        font-size: clamp(20px, 3vw, 34px);
        font-weight: 700;
        line-height: 1.05;
      }

      .overlay-device-name {
        color: var(--overlay-soft);
        font-size: 13px;
      }

      .overlay-device-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .overlay-battery-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--overlay-line);
        background: rgba(20, 14, 12, 0.2);
        color: var(--overlay-white);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        backdrop-filter: blur(8px);
      }

      .overlay-channels {
        display: grid;
        gap: 10px;
      }

      .overlay-channel {
        display: grid;
        gap: 6px;
      }

      .overlay-channel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        color: var(--overlay-soft);
      }

      .overlay-bar-track {
        width: 100%;
        height: 16px;
        overflow: hidden;
        border-radius: 999px;
        border: 1px solid var(--overlay-line);
        background: var(--panel-bg);
        backdrop-filter: blur(8px);
      }

      .overlay-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        transition: width 120ms linear;
      }

      .overlay-bar-fill-a {
        background: linear-gradient(90deg, rgba(255, 138, 76, 0.24), var(--channel-a));
        box-shadow: 0 0 18px rgba(255, 138, 76, 0.28);
      }

      .overlay-bar-fill-b {
        background: linear-gradient(90deg, rgba(81, 168, 255, 0.24), var(--channel-b));
        box-shadow: 0 0 18px rgba(81, 168, 255, 0.28);
      }

      .overlay-canvas-wrap {
        height: 84px;
        border-radius: 18px;
        border: 1px solid var(--overlay-line);
        background: rgba(20, 14, 12, 0.18);
        backdrop-filter: blur(8px);
        overflow: hidden;
      }

      .overlay-waveform-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .overlay-recent {
        min-width: 0;
        display: grid;
        gap: 8px;
      }

      .overlay-recent-title {
        margin: 0;
        color: var(--overlay-soft);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .overlay-danmaku-list {
        display: grid;
        gap: 6px;
        max-height: 116px;
        overflow: hidden;
      }

      .overlay-danmaku-item {
        min-width: 0;
        padding: 7px 9px;
        border-radius: 12px;
        border: 1px solid var(--overlay-line);
        background: rgba(20, 14, 12, 0.2);
        backdrop-filter: blur(8px);
      }

      .overlay-danmaku-item strong,
      .overlay-danmaku-item span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .overlay-danmaku-item strong {
        font-size: 12px;
      }

      .overlay-danmaku-item span {
        margin-top: 3px;
        color: var(--overlay-soft);
        font-size: 12px;
      }

      @media (max-width: 860px) {
        .overlay-root {
          grid-template-columns: 1fr;
          gap: 12px;
          padding: 10px 12px;
        }

        .overlay-waveform-name {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="overlay-root" id="overlay-root" data-connected="false">
      <section class="overlay-meta">
        <div class="overlay-status">
          <span class="overlay-dot"></span>
          <span id="overlay-connection-text">蓝牙未连接</span>
        </div>
        <div class="overlay-waveform-name" id="overlay-waveform-name">待机中</div>
        <div class="overlay-device-meta">
          <div class="overlay-device-name" id="overlay-device-name">未连接设备</div>
          <div class="overlay-battery-chip">
            <span>电量</span>
            <strong id="overlay-battery-value">--</strong>
          </div>
        </div>
      </section>

      <section class="overlay-channels">
        <article class="overlay-channel">
          <div class="overlay-channel-head">
            <span>A 通道</span>
            <strong id="overlay-channel-a-value">0</strong>
          </div>
          <div class="overlay-bar-track">
            <div class="overlay-bar-fill overlay-bar-fill-a" id="overlay-channel-a-bar"></div>
          </div>
        </article>
        <article class="overlay-channel">
          <div class="overlay-channel-head">
            <span>B 通道</span>
            <strong id="overlay-channel-b-value">0</strong>
          </div>
          <div class="overlay-bar-track">
            <div class="overlay-bar-fill overlay-bar-fill-b" id="overlay-channel-b-bar"></div>
          </div>
        </article>
      </section>

      <section class="overlay-canvas-wrap" aria-label="蓝牙实时叠加窗">
        <canvas class="overlay-waveform-canvas" id="overlay-waveform-canvas"></canvas>
      </section>

      <section class="overlay-recent">
        <p class="overlay-recent-title">最近触发</p>
        <div class="overlay-danmaku-list" id="overlay-danmaku-list"></div>
      </section>
    </main>

    <script src="/static/bluetooth_overlay.js"></script>
  </body>
</html>
