<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>波形与事件规则</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="page studio-page">
      <section class="hero panel">
        <div class="hero-copy">
          <p class="eyebrow">Bluetooth Studio</p>
          <h1>波形与事件规则</h1>
          <p class="subtitle">在独立页面里查看 EMS 波形曲线，并为礼物、点赞、弹幕规则选择对应的波形。</p>
          <div class="hero-tags">
            <span>波形曲线预览</span>
            <span>事件规则绑定</span>
            <span>独立管理页</span>
          </div>
        </div>
        <div class="hero-side">
          <a class="hero-link" href="/">返回监听控制台</a>
          <div class="studio-hero-actions">
            <button id="studio-new-waveform-btn" class="secondary">新建空白波形</button>
            <button id="studio-save-btn">保存规则</button>
          </div>
        </div>
      </section>

      <section class="studio-layout">
        <article class="panel studio-panel">
          <div class="section-head">
            <div>
              <p class="section-kicker">Waveform Library</p>
              <h2>波形库</h2>
            </div>
          </div>
          <div id="studio-waveform-library" class="studio-waveform-library"></div>
        </article>

        <div class="studio-main-stack">
          <article class="panel studio-waveform-editor" id="studio-waveform-editor">
            <div class="section-head">
              <div>
                <p class="section-kicker">Waveform Editor</p>
                <h2>波形编辑器</h2>
              </div>
              <div class="studio-editor-actions">
                <button id="studio-duplicate-waveform-btn" class="secondary">复制为自定义</button>
                <button id="studio-delete-waveform-btn" class="secondary">删除当前波形</button>
                <button id="studio-save-waveform-btn">保存波形</button>
              </div>
            </div>
            <div class="studio-editor-meta">
              <label class="studio-editor-field">
                <span>波形名称</span>
                <input id="studio-waveform-name-input" type="text" placeholder="输入波形名称" />
              </label>
              <div class="studio-editor-stats">
                <div><span>分段数</span><strong id="studio-waveform-step-count">0</strong></div>
                <div><span>总时长</span><strong id="studio-waveform-duration-total">0 ms</strong></div>
                <div><span>最大强度</span><strong id="studio-waveform-max-strength">0</strong></div>
              </div>
            </div>
            <p class="hint" id="studio-waveform-message-text">选择一个波形，或新建后开始编辑。</p>
            <div class="studio-editor-canvas" id="studio-waveform-canvas" aria-label="波形编辑画布"></div>
            <div class="studio-editor-toolbar">
              <button id="studio-add-step-btn" class="secondary">新增分段</button>
              <span class="studio-dirty-indicator" id="studio-dirty-indicator">未保存更改</span>
            </div>
            <div id="studio-waveform-steps" class="studio-waveform-steps"></div>
          </article>

          <article class="panel studio-panel">
            <div class="section-head">
              <div>
                <p class="section-kicker">Event Rules</p>
                <h2>事件规则</h2>
              </div>
              <div class="studio-editor-actions">
                <button id="studio-sort-gift-rules-btn" class="secondary">按价格升序整理</button>
              </div>
            </div>
            <p class="hint" id="studio-message-text">修改完成后点击“保存规则”。</p>
            <div id="studio-rule-groups" class="studio-rule-groups"></div>
          </article>
        </div>
      </section>
    </main>

    <script src="/static/bluetooth_studio.js"></script>
  </body>
</html>
