<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="biliMarkTitle biliMarkDesc">
  <title id="biliMarkTitle">BiliLive YOKONEX Bilibili Style Logo Mark</title>
  <desc id="biliMarkDesc">A Bilibili-inspired live logo mark with a TV frame, play symbol, danmaku bars and a routed Y waveform.</desc>
  <defs>
    <linearGradient id="biliBg" x1="70" y1="60" x2="442" y2="452" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1B2A"/>
      <stop offset="0.5" stop-color="#0A1320"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="biliScreen" x1="124" y1="124" x2="388" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243B56"/>
      <stop offset="1" stop-color="#111F2F"/>
    </linearGradient>
    <linearGradient id="biliAccent" x1="156" y1="148" x2="350" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3DD5F3"/>
      <stop offset="0.5" stop-color="#61C6FF"/>
      <stop offset="1" stop-color="#FB7299"/>
    </linearGradient>
    <linearGradient id="biliWave" x1="146" y1="338" x2="370" y2="362" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BE7FF"/>
      <stop offset="1" stop-color="#FFC0D4"/>
    </linearGradient>
    <radialGradient id="biliGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 246) rotate(90) scale(172)">
      <stop stop-color="#3DD5F3" stop-opacity="0.28"/>
      <stop offset="0.7" stop-color="#FB7299" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FB7299" stop-opacity="0"/>
    </radialGradient>
    <filter id="biliShadow" x="26" y="18" width="460" height="474" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <g filter="url(#biliShadow)">
    <rect x="56" y="56" width="400" height="400" rx="104" fill="url(#biliBg)"/>
    <rect x="56.75" y="56.75" width="398.5" height="398.5" rx="103.25" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  </g>

  <circle cx="256" cy="246" r="158" fill="url(#biliGlow)"/>

  <path d="M182 120L154 84" stroke="#A7EEFF" stroke-width="16" stroke-linecap="round"/>
  <path d="M330 120L358 84" stroke="#A7EEFF" stroke-width="16" stroke-linecap="round"/>

  <rect x="116" y="118" width="280" height="230" rx="66" fill="url(#biliScreen)" stroke="url(#biliAccent)" stroke-width="6"/>
  <rect x="144" y="152" width="224" height="162" rx="40" fill="rgba(255,255,255,0.04)" stroke="rgba(167,238,255,0.18)" stroke-width="2"/>

  <rect x="156" y="178" width="48" height="12" rx="6" fill="#A7EEFF" fill-opacity="0.92"/>
  <rect x="216" y="178" width="64" height="12" rx="6" fill="#75D9FF" fill-opacity="0.96"/>
  <rect x="292" y="178" width="64" height="12" rx="6" fill="#FF9ABB" fill-opacity="0.92"/>

  <path d="M202 218L256 262L310 218" stroke="url(#biliAccent)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 262V334" stroke="url(#biliAccent)" stroke-width="28" stroke-linecap="round"/>

  <circle cx="202" cy="218" r="12" fill="#B8F3FF"/>
  <circle cx="310" cy="218" r="12" fill="#FFC1D5"/>
  <circle cx="256" cy="262" r="12" fill="#EEF9FF"/>
  <circle cx="256" cy="262" r="30" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>

  <path d="M160 332H196L220 304L244 344L268 284L292 350L320 320H352" stroke="url(#biliWave)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M120 246C120 215 136 188 162 172" stroke="#77DAFF" stroke-width="10" stroke-linecap="round" stroke-opacity="0.82"/>
  <path d="M392 246C392 215 376 188 350 172" stroke="#FF9FC0" stroke-width="10" stroke-linecap="round" stroke-opacity="0.82"/>

  <circle cx="172" cy="382" r="7" fill="#A7EEFF"/>
  <circle cx="340" cy="382" r="7" fill="#FFC1D5"/>
</svg>
