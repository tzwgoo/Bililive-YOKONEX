    <text x="640" y="132" fill="#7FDEFF" font-family="'Segoe UI', 'Arial', sans-serif" font-size="17" font-weight="800" letter-spacing="3.4">BILIBILI LIVE SIGNAL</text>

    <text x="612" y="244" fill="#EDF9FF" font-family="'Segoe UI', 'Arial', sans-serif" font-size="88" font-weight="820" letter-spacing="0.8">BiliLive</text>
    <text x="972" y="244" fill="url(#biliWord)" font-family="'Segoe UI', 'Arial', sans-serif" font-size="86" font-weight="920" letter-spacing="1.5">YOKONEX</text>

    <text x="614" y="300" fill="#C7D5E8" font-family="'Segoe UI', 'Arial', sans-serif" font-size="26" font-weight="500" letter-spacing="0.3">
