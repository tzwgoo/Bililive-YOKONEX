<svg width="1600" height="512" viewBox="0 0 1600 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="biliLogoTitle biliLogoDesc">
  <title id="biliLogoTitle">BiliLive YOKONEX Bilibili Style Logo</title>
  <desc id="biliLogoDesc">A horizontal logo variant with stronger Bilibili live cues, TV framing, danmaku bars and blue pink streaming accents.</desc>
  <defs>
    <linearGradient id="biliHeroBg" x1="88" y1="52" x2="438" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1B2A"/>
      <stop offset="0.52" stop-color="#0A1320"/>
      <stop offset="1" stop-color="#070E17"/>
    </linearGradient>
    <linearGradient id="biliHeroScreen" x1="126" y1="120" x2="384" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#233A54"/>
      <stop offset="1" stop-color="#111F2F"/>
    </linearGradient>
    <linearGradient id="biliHeroAccent" x1="168" y1="150" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37D3F4"/>
      <stop offset="0.48" stop-color="#71CAFF"/>
      <stop offset="1" stop-color="#FB7299"/>
    </linearGradient>
    <linearGradient id="biliHeroWave" x1="154" y1="328" x2="356" y2="356" gradientUnits="userSpaceOnUse">
      <stop stop-color="#97ECFF"/>
      <stop offset="1" stop-color="#FFC0D4"/>
    </linearGradient>
    <linearGradient id="biliWord" x1="1020" y1="158" x2="1460" y2="258" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38D6F5"/>
      <stop offset="0.48" stop-color="#76CAFF"/>
      <stop offset="1" stop-color="#FB7299"/>
    </linearGradient>
    <radialGradient id="biliHeroGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(258 238) rotate(90) scale(170)">
      <stop stop-color="#38D6F5" stop-opacity="0.24"/>
      <stop offset="0.72" stop-color="#FB7299" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FB7299" stop-opacity="0"/>
    </radialGradient>
    <filter id="biliHeroShadow" x="52" y="36" width="416" height="436" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="biliTypeShadow" x="604" y="82" width="898" height="264" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="512" rx="48" fill="#090B12"/>

