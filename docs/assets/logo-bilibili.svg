  <path d="M186 122L158 88" stroke="#A8EFFF" stroke-width="15" stroke-linecap="round"/>
  <path d="M330 122L358 88" stroke="#A8EFFF" stroke-width="15" stroke-linecap="round"/>

  <rect x="120" y="118" width="272" height="226" rx="64" fill="url(#biliHeroScreen)" stroke="url(#biliHeroAccent)" stroke-width="6"/>
  <rect x="146" y="150" width="220" height="158" rx="38" fill="rgba(255,255,255,0.04)" stroke="rgba(168,239,255,0.16)" stroke-width="2"/>
  <rect x="160" y="176" width="46" height="11" rx="5.5" fill="#AAF1FF" fill-opacity="0.92"/>
  <rect x="216" y="176" width="62" height="11" rx="5.5" fill="#79D6FF"/>
  <rect x="290" y="176" width="62" height="11" rx="5.5" fill="#FFA3C1"/>

  <path d="M204 214L256 258L308 214" stroke="url(#biliHeroAccent)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 258V332" stroke="url(#biliHeroAccent)" stroke-width="26" stroke-linecap="round"/>
  <circle cx="204" cy="214" r="11" fill="#B8F3FF"/>
  <circle cx="308" cy="214" r="11" fill="#FFC1D5"/>
  <circle cx="256" cy="258" r="11" fill="#F4FBFF"/>
  <circle cx="256" cy="258" r="28" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>
  <path d="M160 326H194L218 298L242 338L266 280L290 344L316 314H354" stroke="url(#biliHeroWave)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M124 240C124 212 138 188 162 174" stroke="#7ADCFF" stroke-width="10" stroke-linecap="round" stroke-opacity="0.84"/>
