name: Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Print Build Environment
        shell: powershell
        run: |
          python --version
          pip --version
          Get-Command python
          Get-Command pip
          node --version
          npm --version
          Get-Command npm
          python -m pip show pyinstaller
          Get-ChildItem -Path .

      - name: Run Release Checks
        shell: powershell
        run: |
          pytest tests/test_frontend_assets.py -v
          pytest tests/test_build_script.py -v
          pytest tests/test_release_workflow.py -v

      - name: Build Frontend
        shell: powershell
        run: |
          Push-Location frontend
          try {
            npm ci
            npm run build
          } finally {
            Pop-Location
          }

          if (-not (Test-Path "frontend/dist/index.html")) {
            throw "Missing frontend dist output: frontend/dist/index.html"
          }

      - name: Build EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "build_logs" | Out-Null

          $distRoot = Join-Path $PWD "dist"
          $packageRoot = Join-Path $distRoot "BiliLive-YOKONEX"
          $stdoutLog = Join-Path $PWD "build_logs/pyinstaller.stdout.log"
          $stderrLog = Join-Path $PWD "build_logs/pyinstaller.stderr.log"
          $combinedLog = Join-Path $PWD "build_logs/pyinstaller.log"

          if (Test-Path $packageRoot) {
            Remove-Item -Recurse -Force $packageRoot
          }

          $pyInstallerArgs = @(
            "-m",
            "PyInstaller",
            "--noconfirm",
            "--clean",
            "--onedir",
            "--name", "BiliLive-YOKONEX",
            "--exclude-module", "PyQt5",
            "--exclude-module", "PyQt6",
            "--exclude-module", "PySide2",
            "--exclude-module", "PySide6",
            "--exclude-module", "matplotlib",
            "--exclude-module", "IPython",
            "--exclude-module", "jupyter_client",
            "--exclude-module", "jupyter_core",
            "--exclude-module", "tkinter",
            "--hidden-import", "bilibili_api.clients.HTTPXClient",
            "--hidden-import", "bilibili_api.clients.AioHTTPClient",
            "--hidden-import", "bilibili_api.clients.CurlCFFIClient",
            "--add-data", "app/templates;app/templates",
            "--add-data", "app/static;app/static",
            "--add-data", "frontend/dist;frontend/dist",
            "run_app.py"
          )

          $pyInstallerProcess = Start-Process `
            -FilePath "python" `
            -ArgumentList $pyInstallerArgs `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -NoNewWindow `
            -PassThru `
            -Wait

          if (Test-Path $combinedLog) {
            Remove-Item $combinedLog -Force
          }
          if (Test-Path $stdoutLog) {
            Get-Content $stdoutLog | Tee-Object -FilePath $combinedLog -Append
          }
          if (Test-Path $stderrLog) {
            Get-Content $stderrLog | Tee-Object -FilePath $combinedLog -Append
          }

          $pyInstallerExitCode = $pyInstallerProcess.ExitCode

          if ($pyInstallerExitCode -ne 0) {
            throw "PyInstaller build failed with exit code: $pyInstallerExitCode"
          }

          New-Item -ItemType Directory -Force -Path (Join-Path $packageRoot "config") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $packageRoot "docs") | Out-Null
          Copy-Item ".env.example" (Join-Path $packageRoot ".env.example") -Force
          # Ship bundled mapping defaults so runtime can hydrate AppData on first launch.
          Copy-Item "config/gift_command_mappings.json" (Join-Path $packageRoot "config/gift_command_mappings.json") -Force
          Copy-Item "config/gift_command_mappings.example.json" (Join-Path $packageRoot "config/gift_command_mappings.example.json") -Force
          Copy-Item (Join-Path $PWD "docs\*.md") (Join-Path $packageRoot "docs") -Force

          $exePath = Join-Path $packageRoot "BiliLive-YOKONEX.exe"
          if (-not (Test-Path $exePath)) {
            throw "Missing EXE output: $exePath"
          }

          $requiredPackageFiles = @(
            (Join-Path $packageRoot ".env.example"),
            (Join-Path $packageRoot "config/gift_command_mappings.json"),
            (Join-Path $packageRoot "config/gift_command_mappings.example.json")
          )
          foreach ($requiredFile in $requiredPackageFiles) {
            # Fail early if a template file is missing from the packaged app.
            if (-not (Test-Path $requiredFile)) {
              throw "Missing packaged file: $requiredFile"
            }
          }

      - name: Upload Debug Logs On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-debug-${{ github.ref_name }}
          path: |
            build_logs/**
            build/**
            BiliLive-YOKONEX.spec
          if-no-files-found: warn

      - name: Package Distribution Folder
        shell: powershell
        run: |
          $zipName = "Bililive-YOKONEX-$env:TAG_NAME-win-x64.zip"
          $zipPath = Join-Path $PWD $zipName
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "dist/BiliLive-YOKONEX/*" -DestinationPath $zipPath
          Write-Output "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV
          Write-Output "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create Or Update Release
        shell: powershell
        run: |
          $releaseLogDir = Join-Path $PWD "release_logs"
          New-Item -ItemType Directory -Force -Path $releaseLogDir | Out-Null

          $viewStdoutLog = Join-Path $releaseLogDir "gh-release-view.stdout.log"
          $viewStderrLog = Join-Path $releaseLogDir "gh-release-view.stderr.log"
          $createStdoutLog = Join-Path $releaseLogDir "gh-release-create.stdout.log"
          $createStderrLog = Join-Path $releaseLogDir "gh-release-create.stderr.log"

          $releaseViewProcess = Start-Process `
            -FilePath "gh" `
            -ArgumentList @("release", "view", $env:TAG_NAME) `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $viewStdoutLog `
            -RedirectStandardError $viewStderrLog `
            -NoNewWindow `
            -PassThru `
            -Wait

          if ($releaseViewProcess.ExitCode -ne 0) {
            $releaseCreateProcess = Start-Process `
              -FilePath "gh" `
              -ArgumentList @("release", "create", $env:TAG_NAME, "--title", $env:TAG_NAME, "--generate-notes") `
              -WorkingDirectory $PWD `
              -RedirectStandardOutput $createStdoutLog `
              -RedirectStandardError $createStderrLog `
              -NoNewWindow `
              -PassThru `
              -Wait

            if ($releaseCreateProcess.ExitCode -ne 0) {
              if (Test-Path $createStdoutLog) {
                Get-Content $createStdoutLog
              }
              if (Test-Path $createStderrLog) {
                Get-Content $createStderrLog
              }
              throw "gh release create failed with exit code: $($releaseCreateProcess.ExitCode)"
            }
          }

      - name: Upload Release Assets
        shell: powershell
        run: |
          $releaseLogDir = Join-Path $PWD "release_logs"
          New-Item -ItemType Directory -Force -Path $releaseLogDir | Out-Null

          $uploadStdoutLog = Join-Path $releaseLogDir "gh-release-upload.stdout.log"
          $uploadStderrLog = Join-Path $releaseLogDir "gh-release-upload.stderr.log"

          $releaseUploadProcess = Start-Process `
            -FilePath "gh" `
            -ArgumentList @(
              "release",
              "upload",
              $env:TAG_NAME,
              "dist/BiliLive-YOKONEX/BiliLive-YOKONEX.exe",
              "dist/BiliLive-YOKONEX/.env.example",
              "dist/BiliLive-YOKONEX/config/gift_command_mappings.json",
              $env:ZIP_PATH,
              "--clobber"
            ) `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $uploadStdoutLog `
            -RedirectStandardError $uploadStderrLog `
            -NoNewWindow `
            -PassThru `
            -Wait

          if ($releaseUploadProcess.ExitCode -ne 0) {
            if (Test-Path $uploadStdoutLog) {
              Get-Content $uploadStdoutLog
            }
            if (Test-Path $uploadStderrLog) {
              Get-Content $uploadStderrLog
            }
            throw "gh release upload failed with exit code: $($releaseUploadProcess.ExitCode)"
          }
